<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Segura — Usuarios</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <h1>🛡️ Ciudad Segura</h1>
        <nav class="menu">
            <a href="/index.html">Inicio</a>
            <a href="/reportes.html">Reportes</a>
            <a href="/zonas.html">Zonas de riesgo</a>
            <a href="/alertas.html">Alertas</a>
            <a href="/usuarios.html" class="activo">Usuarios</a>
        </nav>
        <div id="usuario-activo"></div>
    </header>

    <main>
        <div class="tarjeta">
            <h2>Usuarios registrados</h2>
            <p>Nuevos usuarios se crean desde <a href="/login.html">la página de registro</a>. Aquí puedes
               consultar, actualizar y eliminar los usuarios existentes.</p>
            <div id="msg" class="mensaje oculto"></div>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Registrado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tabla-usuarios"></tbody>
            </table>
        </div>

        <div class="tarjeta oculto" id="tarjeta-editar">
            <h2>Editar usuario</h2>
            <form class="formulario" id="form-editar">
                <input type="hidden" id="edit-id">
                <div>
                    <label>Nombre</label>
                    <input type="text" id="edit-nombre" required>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div class="botones">
                    <button type="submit">Guardar cambios</button>
                    <button type="button" class="secundario" onclick="cancelarEdicion()">Cancelar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/api-config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        async function cargarUsuarios() {
            try {
                const usuarios = await CiudadSeguraAPI.listarUsuarios();
                const tbody = document.getElementById("tabla-usuarios");
                tbody.innerHTML = usuarios.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.email}</td>
                        <td>${u.rol}</td>
                        <td>${formatearFecha(u.fechaRegistro)}</td>
                        <td class="acciones-fila">
                            <button onclick="editar(${u.id}, '${u.nombre.replace(/'/g, "\\'")}', '${u.email}')">Editar</button>
                            <button class="peligro" onclick="eliminar(${u.id})">Eliminar</button>
                        </td>
                    </tr>`).join("") || `<tr><td colspan="6">No hay usuarios registrados.</td></tr>`;
            } catch (err) {
                mostrarMensaje("msg", err.message);
            }
        }

        function editar(id, nombre, email) {
            document.getElementById("edit-id").value = id;
            document.getElementById("edit-nombre").value = nombre;
            document.getElementById("edit-email").value = email;
            document.getElementById("tarjeta-editar").classList.remove("oculto");
            window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
        }

        function cancelarEdicion() {
            document.getElementById("tarjeta-editar").classList.add("oculto");
        }

        document.getElementById("form-editar").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("edit-id").value;
            try {
                await CiudadSeguraAPI.actualizarUsuario(id, {
                    nombre: document.getElementById("edit-nombre").value,
                    email: document.getElementById("edit-email").value,
                });
                cancelarEdicion();
                cargarUsuarios();
            } catch (err) {
                mostrarMensaje("msg", err.message);
            }
        });

        async function eliminar(id) {
            if (!confirm("¿Eliminar este usuario?")) return;
            try {
                await CiudadSeguraAPI.eliminarUsuario(id);
                cargarUsuarios();
            } catch (err) {
                mostrarMensaje("msg", err.message);
            }
        }

        cargarUsuarios();
    </script>
</body>
</html>
