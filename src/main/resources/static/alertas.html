<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Segura - Alertas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <h1>Ciudad Segura</h1>
        <nav class="menu">
            <a href="/inicio">Inicio</a>
            <a href="/reportes">Reportes</a>
            <a href="/zonas">Zonas de riesgo</a>
            <a href="/alertas" class="activo">Alertas</a>
            <a href="/usuarios">Usuarios</a>
        </nav>
        <div id="usuario-activo"></div>
    </header>

    <main>
        <div class="tarjeta">
            <h2>Nueva alerta</h2>
            <div id="msg-form" class="mensaje oculto"></div>
            <form class="formulario" id="form-alerta">
                <div>
                    <label for="alerta-titulo">Título</label>
                    <input type="text" id="alerta-titulo" required>
                </div>
                <div>
                    <label for="alerta-mensaje">Mensaje / Descripción</label>
                    <textarea id="alerta-mensaje" rows="3" required></textarea>
                </div>
                <div class="fila-doble">
                    <div>
                        <label for="alerta-tipo">Tipo</label>
                        <select id="alerta-tipo">
                            <option value="SEGURIDAD">Seguridad</option>
                            <option value="EMERGENCIA">Emergencia</option>
                            <option value="PREVENCION">Prevención</option>
                            <option value="INFORMATIVA">Informativa</option>
                        </select>
                    </div>
                    <div>
                        <label for="alerta-severidad">Severidad</label>
                        <select id="alerta-severidad">
                            <option value="BAJA">Baja</option>
                            <option value="MEDIA">Media</option>
                            <option value="ALTA">Alta</option>
                            <option value="CRITICA">Crítica</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="boton primario">Emitir Alerta</button>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Alertas registradas</h2>
            <div id="msg-tabla" class="mensaje oculto"></div>
            <div id="tabla-alertas-contenedor">
                <p>Cargando lista de alertas...</p>
            </div>
        </div>
    </main>

    <script src="/js/api.config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/alertas.js"></script>
</body>
</html>
