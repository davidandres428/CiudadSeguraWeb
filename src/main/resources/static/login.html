<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Segura — Acceso</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <h1>🛡️ Ciudad Segura</h1>
        <nav class="menu">
            <a href="/index.html">Inicio</a>
        </nav>
        <div id="usuario-activo"></div>
    </header>

    <main class="auth-main">
        <section class="tarjeta auth-card" aria-label="Acceso a Ciudad Segura">
            <nav class="auth-tabs" role="tablist" aria-label="Opciones de acceso">
                <a id="tab-login" href="#form-login" role="tab" aria-controls="panel-login">Iniciar sesión</a>
                <a id="tab-registro" href="#form-registro" role="tab" aria-controls="panel-registro">Registrarse</a>
            </nav>

            <section id="panel-login" class="auth-panel" role="tabpanel" aria-labelledby="tab-login">
                <h2>Iniciar sesión</h2>
                <div id="msg-login" class="mensaje oculto"></div>
                <form class="formulario" id="form-login">
                    <div>
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div>
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <div class="botones">
                        <button type="submit">Ingresar</button>
                    </div>
                </form>
                <p class="auth-switch">¿No tienes cuenta? <a href="#form-registro">Regístrate aquí</a></p>
            </section>

            <section id="panel-registro" class="auth-panel" role="tabpanel" aria-labelledby="tab-registro" hidden>
                <h2>Registrarse</h2>
                <div id="msg-registro" class="mensaje oculto"></div>
                <form class="formulario" id="form-registro">
                    <div>
                        <label for="reg-nombre">Nombre</label>
                        <input type="text" id="reg-nombre" required>
                    </div>
                    <div>
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div>
                        <label for="reg-password">Contraseña (mínimo 6 caracteres)</label>
                        <input type="password" id="reg-password" minlength="6" required>
                    </div>
                    <p>Las cuentas nuevas se crean como ciudadano. El rol administrador se asigna por personal autorizado.</p>
                    <div class="botones">
                        <button type="submit">Crear cuenta</button>
                    </div>
                </form>
                <p class="auth-switch">¿Ya tienes cuenta? <a href="#form-login">Inicia sesión</a></p>
            </section>
        </section>
    </main>

    <script src="/js/api-config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const authTabs = [
            { tab: document.getElementById("tab-login"), panel: document.getElementById("panel-login"), hash: "#form-login" },
            { tab: document.getElementById("tab-registro"), panel: document.getElementById("panel-registro"), hash: "#form-registro" },
        ];

        function seleccionarFormulario(hash = window.location.hash) {
            const registroActivo = hash === "#form-registro";
            authTabs.forEach(({ tab, panel, hash: tabHash }) => {
                const activo = (tabHash === "#form-registro") === registroActivo;
                tab.setAttribute("aria-selected", String(activo));
                tab.setAttribute("tabindex", activo ? "0" : "-1");
                panel.hidden = !activo;
            });
        }

        document.querySelector(".auth-tabs").addEventListener("click", (event) => {
            const tab = event.target.closest('a[role="tab"]');
            if (!tab) return;
            event.preventDefault();
            window.location.hash = tab.getAttribute("href");
        });

        document.querySelector(".auth-tabs").addEventListener("keydown", (event) => {
            const currentIndex = authTabs.findIndex(({ tab }) => tab === event.target);
            if (currentIndex < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
            event.preventDefault();
            const nextIndex = event.key === "Home" ? 0
                : event.key === "End" ? authTabs.length - 1
                : (currentIndex + (event.key === "ArrowRight" ? 1 : -1) + authTabs.length) % authTabs.length;
            const nextTab = authTabs[nextIndex].tab;
            nextTab.focus();
            window.location.hash = nextTab.getAttribute("href");
        });

        window.addEventListener("hashchange", () => seleccionarFormulario());
        seleccionarFormulario();

        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            ocultarMensaje("msg-login");
            try {
                const auth = await CiudadSeguraAPI.login({
                    email: document.getElementById("login-email").value,
                    password: document.getElementById("login-password").value,
                });
                Sesion.guardar(auth.usuario, auth.accessToken);
                window.location.href = "/index.html";
            } catch (err) {
                mostrarMensaje("msg-login", err.message);
            }
        });

        document.getElementById("form-registro").addEventListener("submit", async (e) => {
            e.preventDefault();
            ocultarMensaje("msg-registro");
            try {
                const auth = await CiudadSeguraAPI.registrar({
                    nombre: document.getElementById("reg-nombre").value,
                    email: document.getElementById("reg-email").value,
                    password: document.getElementById("reg-password").value,
                });
                Sesion.guardar(auth.usuario, auth.accessToken);
                mostrarMensaje("msg-registro", "Cuenta creada con éxito. Redirigiendo...", "exito");
                setTimeout(() => window.location.href = "/index.html", 900);
            } catch (err) {
                mostrarMensaje("msg-registro", err.message);
            }
        });
    </script>
</body>
</html>
