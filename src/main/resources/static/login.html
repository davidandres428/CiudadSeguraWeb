<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Segura — Acceso</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <h1>🛡️ Ciudad Segura</h1>
        <nav class="menu">
            <a href="/index.html">Inicio</a>
        </nav>
        <div id="usuario-activo"></div>
    </header>

    <main style="max-width: 480px;">
        <div class="tarjeta">
            <h2>Iniciar sesión</h2>
            <div id="msg-login" class="mensaje oculto"></div>
            <form class="formulario" id="form-login">
                <div>
                    <label>Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div>
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required>
                </div>
                <div class="botones">
                    <button type="submit">Ingresar</button>
                </div>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Registrarse</h2>
            <div id="msg-registro" class="mensaje oculto"></div>
            <form class="formulario" id="form-registro">
                <div>
                    <label>Nombre</label>
                    <input type="text" id="reg-nombre" required>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div>
                    <label>Contraseña (mínimo 6 caracteres)</label>
                    <input type="password" id="reg-password" minlength="6" required>
                </div>
                <div class="botones">
                    <button type="submit">Crear cuenta</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/api-config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            ocultarMensaje("msg-login");
            try {
                const auth = await CiudadSeguraAPI.login({
                    email: document.getElementById("login-email").value,
                    password: document.getElementById("login-password").value,
                });
                Sesion.guardar(auth);
                window.location.href = "/index.html";
            } catch (err) {
                mostrarMensaje("msg-login", err.message);
            }
        });

        document.getElementById("form-registro").addEventListener("submit", async (e) => {
            e.preventDefault();
            ocultarMensaje("msg-registro");
            try {
                const auth = await CiudadSeguraAPI.registrar({
                    nombre: document.getElementById("reg-nombre").value,
                    email: document.getElementById("reg-email").value,
                    password: document.getElementById("reg-password").value,
                });
                Sesion.guardar(auth);
                mostrarMensaje("msg-registro", "Cuenta creada con éxito. Redirigiendo...", "exito");
                setTimeout(() => window.location.href = "/index.html", 900);
            } catch (err) {
                mostrarMensaje("msg-registro", err.message);
            }
        });
    </script>
</body>
</html>
