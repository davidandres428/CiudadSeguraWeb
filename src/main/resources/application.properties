spring.application.name=ciudad-segura

spring.datasource.url=jdbc:h2:mem:ciudad_segura;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8081}

# JWT: en producción JWT_SECRET es obligatorio (mínimo 32 caracteres). El valor por defecto es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-0123456789}
app.jwt.expiracion-horas=8
# Primer administrador (opcional)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}