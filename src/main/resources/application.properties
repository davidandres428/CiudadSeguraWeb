spring.application.name=ciudad-segura

spring.datasource.url=jdbc:h2:file:./data/ciudadsegura;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Mantiene las tablas y los datos intactos en cada reinicio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8081}
server.forward-headers-strategy=framework

security.jwt.secret=${JWT_SECRET:test-only-signing-key-long-enough-for-tests}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

app.seed.enabled=true