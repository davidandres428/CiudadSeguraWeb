# === Ciudad Segura - configuracion de la aplicacion ===

spring.application.name=ciudad-segura

# --- Base de datos MySQL ---
# Ajusta usuario, contraseña y nombre de la base de datos segun tu entorno local.
# La base de datos se crea automaticamente si no existe (createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/ciudad_segura?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' crea/actualiza las tablas automaticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
