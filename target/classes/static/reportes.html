<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Segura - Reportes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <h1>Ciudad Segura</h1>
        <nav class="menu">
            <a href="/inicio">Inicio</a>
            <a href="/reportes" class="activo">Reportes</a>
            <a href="/zonas">Zonas de riesgo</a>
            <a href="/alertas">Alertas</a>
            <a href="/usuarios">Usuarios</a>
        </nav>
        <div id="usuario-activo"></div>
    </header>

    <main>
        <div class="tarjeta" id="tarjeta-form">
            <h2>Nuevo reporte de incidente</h2>
            <div id="msg-form" class="mensaje oculto"></div>
            <form class="formulario" id="form-reporte">
                <div>
                    <label for="reporte-titulo">Título</label>
                    <input type="text" id="reporte-titulo" required>
                </div>
                <div>
                    <label for="reporte-descripcion">Descripción</label>
                    <textarea id="reporte-descripcion" rows="3" required></textarea>
                </div>
                <div>
                    <label for="reporte-direccion">Dirección</label>
                    <input type="text" id="reporte-direccion" required>
                </div>
                <div class="fila-doble">
                    <div>
                        <label for="reporte-tipo">Tipo</label>
                        <select id="reporte-tipo">
                            <option value="ROBO">Robo</option>
                            <option value="ASALTO">Asalto</option>
                            <option value="VANDALISMO">Vandalismo</option>
                            <option value="ACCIDENTE">Accidente</option>
                            <option value="SOSPECHOSO">Sospechoso</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    <div>
                        <label for="reporte-prioridad">Prioridad</label>
                        <select id="reporte-prioridad">
                            <option value="BAJA">Baja</option>
                            <option value="MEDIA">Media</option>
                            <option value="ALTA">Alta</option>
                            <option value="CRITICA">Crítica</option>
                        </select>
                    </div>
                </div>
                <div class="fila-doble">
                    <div>
                        <label for="reporte-latitud">Latitud</label>
                        <input type="number" step="any" id="reporte-latitud" required readonly>
                    </div>
                    <div>
                        <label for="reporte-longitud">Longitud</label>
                        <input type="number" step="any" id="reporte-longitud" required readonly>
                    </div>
                </div>
                <button type="submit" class="boton primario">Registrar reporte</button>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Ubicación en el mapa</h2>
            <p>Haz clic en el mapa para seleccionar las coordenadas del incidente.</p>
            <div id="mapa-reporte" style="height: 400px; width: 100%; border-radius: 8px;"></div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/js/api.config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/reportes.js"></script>
</body>
</html>
