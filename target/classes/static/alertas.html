<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad Segura — Alertas</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><strong>Ciudad Segura</strong></div>
        <div class="nav-links">
            <a href="/inicio">Inicio</a>
            <a href="/reportes">Reportes</a>
            <a href="/zonas">Zonas de riesgo</a>
            <a href="/alertas" class="active">Alertas</a>
            <a href="/usuarios.html">Usuarios</a>
        </div>
    </nav>

    <div class="container" style="max-width: 900px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px;">
        <h2>Nueva alerta</h2>

        <!-- Formulario visible de manera fija para la presentación -->
        <form id="form-nueva-alerta">
            <div style="margin-bottom: 15px;">
                <label for="titulo" style="display: block; margin-bottom: 5px; font-weight: 500;">Título</label>
                <input type="text" id="titulo" name="titulo" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label for="tipo" style="display: block; margin-bottom: 5px; font-weight: 500;">Tipo</label>
                    <select id="tipo" name="tipo" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                        <option value="Seguridad">Seguridad</option>
                        <option value="Clima">Clima</option>
                        <option value="Tráfico">Tráfico</option>
                        <option value="Emergencia">Emergencia</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label for="severidad" style="display: block; margin-bottom: 5px; font-weight: 500;">Severidad</label>
                    <select id="severidad" name="severidad" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label for="mensaje" style="display: block; margin-bottom: 5px; font-weight: 500;">Mensaje / Descripción</label>
                <textarea id="mensaje" name="mensaje" rows="3" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" required></textarea>
            </div>

            <button type="submit" style="background-color: #0f172a; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Emitir alerta</button>
        </form>
    </div>

</body>
</html>
