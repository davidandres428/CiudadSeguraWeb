spring.application.name=ciudad-segura

spring.datasource.url=jdbc:h2:mem:ciudad_segura;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8081}
server.forward-headers-strategy=framework

# Solo para desarrollo local. El perfil prod requiere JWT_SECRET configurado en el entorno.
security.jwt.secret=${JWT_SECRET:local-development-only-change-before-production-2026}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# El seed local es opt-in; producción activa el seed por defecto y requiere un secreto externo.
app.seed.enabled=${SEED_DATA_ENABLED:false}
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
oauth.facebook.graph-api-version=${FACEBOOK_API_VERSION:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}